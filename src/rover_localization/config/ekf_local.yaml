ekf_local:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: false
    use_sim_time: false
    publish_tf: true
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Optical odometry: pose only. Its derived twist would reuse the same images.
    odom0: /zed/zed_node/odom
    odom0_config: [true, true, true,
                   true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # One upstream fused IMU stream. Orientation and acceleration stay disabled
    # until their reference frame, gravity handling, and covariance are verified.
    imu0: /imu/fused
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  true, true, true,
                  false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: false
