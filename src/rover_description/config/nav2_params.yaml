bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/local
    controller_plugins: ["FollowPath"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 5.0
      yaw_goal_tolerance: 3.1415
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0
      max_vel_x: 0.5
      min_vel_x: -0.5
      max_vel_y: 0.0          # ADD THIS - diff drive can't move sideways
      min_vel_y: 0.0          # ADD THIS
      max_vel_theta: 1.0
      min_vel_theta: -1.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0          # ADD THIS
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0        # ADD THIS
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1           # ADD THIS - only 1 sample needed since vy is always 0
      vtheta_samples: 20
      sim_time: 1.7
      min_speed_xy: 0.0       # ADD THIS
      max_speed_xy: 0.5       # ADD THIS
      min_speed_theta: 0.0    # ADD THIS

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # REEDS_SHEPP allows for backward movement
      # DUBIN is forward-only
      motion_model_for_search: "REEDS_SHEPP" 
      minimum_turning_radius: 1.0  # placeholder value
      angle_quantization_bins: 72 # how fine you want angle movements to be

      # tolerance is based on estimated distance left, takes heading into account
      tolerance: 0.25 # in meters
      allow_unknown: false # don't go into unknown places :(
      max_planning_time: 5.0 # in seconds
      downsample_costmap: false # don't decrease costmap resolution

      analytic_expansion_max_length: 5.0 # how far to look in the future
      smooth_path: true # uhhh smooth ?

smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom # temp
      robot_base_frame: base_link
      robot_radius: 0.5 # errr might want to change later
      track_unknown_space: false
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]  # removed static_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          raytrace_max_range: 5.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.5]      # [+X, Y, Theta]
    min_velocity: [-0.5, 0.0, -1.5]    # [-X, Y, Theta]
    max_accel: [2.5, 0.0, 2.5]
    max_decel: [-2.5, 0.0, -2.5]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0