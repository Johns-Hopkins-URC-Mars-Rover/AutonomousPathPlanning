bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    default_nav_to_pose_bt_xml: "$(find-pkg-share rover_navigation)/behavior_trees/navigate_to_pose_forward_with_slow_backup.xml"

controller_server:
  ros__parameters:
    use_sim_time: false
    odom_topic: /odometry/local
    progress_checker_plugin: "progress_checker"
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 30.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 5.0
      yaw_goal_tolerance: 0.35
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      ObstacleFootprint.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0
      # Conservative physical-rover limits. DWB is forward-only during normal
      # path tracking; explicit Nav2 recovery behaviors may still back up.
      max_vel_x: 0.25
      min_vel_x: 0.0
      max_vel_y: 0.0
      min_vel_y: 0.0
      max_vel_theta: 0.5
      acc_lim_x: 0.4
      acc_lim_y: 0.0
      acc_lim_theta: 0.8
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 1.7
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0

planner_server:
  ros__parameters:
    use_sim_time: false
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      # Dubins keeps ordinary navigation forward-only. Reverse motion is
      # reserved for explicit behavior-tree recovery actions such as BackUp.
      motion_model_for_search: "DUBIN"
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015

      # The six-wheel skid-steer base can rotate in place, but Hybrid-A* needs
      # a positive radius. This baseline is informed by the URDF/controller's
      # 0.52 m wheel separation; DWB may still rotate in place while tracking.
      minimum_turning_radius: 0.5
      angle_quantization_bins: 72
      tolerance: 0.25

      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      downsample_costmap: false
      downsampling_factor: 1

      analytic_expansion_ratio: 3.5
      # Nav2 recommends at least 4-5 times the minimum turning radius.
      analytic_expansion_max_length: 2.5
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Only BackUp may command linear reverse. Spin is angular-only and Wait is
    # stationary; DriveOnHeading is intentionally not loaded.
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      footprint: "[[0.60, 0.40], [0.60, -0.40], [-0.52, -0.40], [-0.52, 0.40]]"
      footprint_padding: 0.02
      track_unknown_space: false
      rolling_window: true
      width: 50
      height: 50
      resolution: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          raytrace_max_range: 5.5
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      footprint: "[[0.60, 0.40], [0.60, -0.40], [-0.52, -0.40], [-0.52, 0.40]]"
      footprint_padding: 0.02
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.1
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: pointcloud
        pointcloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.1
          raytrace_max_range: 5.5
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.25, 0.0, 0.5]     # [+X, Y, Theta]
    # The normal DWB -> smoother command path cannot reverse. The BackUp
    # recovery publishes separately from the behavior server on cmd_vel.
    min_velocity: [0.0, 0.0, -0.5]     # [-X, Y, Theta]
    max_accel: [0.4, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
