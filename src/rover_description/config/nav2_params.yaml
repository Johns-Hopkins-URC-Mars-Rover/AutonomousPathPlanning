# Nav2 1.1 / ROS 2 Humble baseline for GPS navigation without a static map.
# Shared by rover_bringup and rover_navigation/launch/nav2.launch.py.
# Localization and the hardware motor interface are started separately from
# the GPS mission client; this file never changes the tested motor signs.
#
# Localization owns map -> odom -> base_link. GPS covariance belongs in NavSatFix,
# not in arrival tolerances. Hardware time is the default; Nav2's launch rewrites
# use_sim_time throughout this file when use_sim_time:=true is supplied.
# Speed/acceleration/clearance values below are conservative commissioning values.
# They must be measured on the actual drive system, not inferred from URDF effort
# limits, and assume physical motion agrees with base_link and encoder signs.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    transform_tolerance: 0.5
    bt_loop_duration: 10                 # milliseconds
    default_server_timeout: 1000         # milliseconds: action acknowledgement
    wait_for_service_timeout: 5000       # milliseconds: BT service discovery
    # Both trees replan at 1 Hz and recover only by waiting 3 s, twice.
    # No spin, reverse, or clearing of observed obstacles is permitted.
    default_nav_to_pose_bt_xml: "$(find-pkg-share rover_description)/behavior_trees/navigate_to_pose.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share rover_description)/behavior_trees/navigate_through_poses.xml"
    # Humble supplies the standard BT libraries. Rolling's navigator plugin
    # settings are not compatible with this installation.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    odom_topic: /odometry/local
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    # Humble uses the singular progress_checker_plugin key. Explicitly list the
    # goal checker too: otherwise the named tolerances may not be the active ones.
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      # Detect a stalled rover in 20 s rather than the previous 300 s. This
      # checker measures displacement, not net progress toward the GPS target;
      # GPS jitter / circling still need mission-level supervision.
      required_movement_radius: 0.20
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 1.0
      # Preserve the existing position-only mission policy: any final yaw is
      # acceptable. Tighten this AND enable GoalAngleCritic if heading matters.
      yaw_goal_tolerance: 3.141592653589793
      stateful: true
    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      # Six driven wheels are approximated as differential/skid steering, not
      # Ackermann steering and not holonomic (no sideways commanded motion).
      motion_model: DiffDrive
      # 56 * 0.05 = 2.8 s prediction. At 0.25 m/s, the horizon covers 0.70 m,
      # comfortably inside the 10 m local map. Profile CPU load with the ZED on.
      time_steps: 56
      model_dt: 0.05                    # matches the 20 Hz controller period
      batch_size: 1000
      iteration_count: 1
      vx_std: 0.15
      vy_std: 0.0
      wz_std: 0.3
      vx_max: 0.25
      vx_min: 0.0                      # normal path following is forward-only
      vy_max: 0.0
      wz_max: 0.35
      prune_distance: 2.0
      transform_tolerance: 0.5
      temperature: 0.3
      gamma: 0.015
      visualize: false                # trajectory markers add substantial load
      reset_period: 1.0
      # Humble MPPI does not expose Rolling's acceleration-limit parameters;
      # velocity_smoother below enforces the outgoing command acceleration limits.
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic,
                PathAlignCritic, PathFollowCritic, PathAngleCritic,
                PreferForwardCritic]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        # A radius misses this long rectangular rover's corners. Both costmaps
        # specify the same URDF-derived polygon for SE2 collision checking.
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 1.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.5
      GoalAngleCritic:
        enabled: false                # consistent with accepting any final yaw
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 1.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0              # moderate alignment allows local detours
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 1.0
        offset_from_furthest: 10
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.5
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 1.0
        max_angle_to_furthest: 1.0
        forward_preference: true       # Humble key; not Rolling's mode enum
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: [GridBased]
    GridBased:
      # Hybrid searches position + orientation using the rectangular footprint.
      # NavFn parameters (use_astar) and duplicate tolerance keys were removed.
      plugin: nav2_smac_planner/SmacPlannerHybrid
      motion_model_for_search: DUBIN  # forward paths, matching MPPI vx_min=0
      # The URDF gives geometry, not a measured skid-steer turning constraint.
      # Retain 1 m provisionally; evaluate State Lattice once turn-in-place
      # behavior and motion primitives are validated for this rover.
      minimum_turning_radius: 1.0
      angle_quantization_bins: 72
      tolerance: 0.5
      # Necessary for planning toward GPS targets beyond observed free space.
      # Unknown is not evidence of traversability; no slope/drop-off reasoning.
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 1.0
      downsample_costmap: false
      cache_obstacle_heuristic: false  # dynamic obstacles and rolling map origin
      cost_penalty: 2.0
      non_straight_penalty: 1.2
      change_penalty: 0.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 4.0
      lookup_table_size: 20.0
      # Hybrid's built-in smoother preserves path boundary/turning constraints.
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    # Stock Nav2 launches this server. Retain SimpleSmoother for explicit
    # SmoothPath requests; the stock BTs above do NOT call it. Avoid a second
    # smoothing pass on Hybrid paths without revalidating curvature/collision.
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 1.0
      transform_tolerance: 1.0
      # Latest rover.urdf (c85ea83) collision meshes at neutral hub positions:
      # x=[-0.5878, 0.5084], y=[-0.5023, 0.5023], ground z ~= -0.296.
      # Use one conservative rectangle for both maps. This encloses the model;
      # suspension sweep and the measured physical outline still need validation.
      footprint: "[[0.62, 0.53], [0.62, -0.53], [-0.62, -0.53], [-0.62, 0.53]]"
      footprint_padding: 0.02
      track_unknown_space: true
      rolling_window: true
      # Preserve the existing 50 m window for detours and intermediate goals.
      # A GPS target must still be inside the current window to be planned to.
      # Obstacles outside sensor range are unknown, not known-free map coverage.
      width: 50
      height: 50
      resolution: 0.1
      always_send_full_costmap: true
      plugins: [voxel_layer, inflation_layer]  # no static map dependency
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false             # enable only while inspecting voxels
        footprint_clearing_enabled: true
        # 16 layers * 0.15 m cover [-0.30, 2.10). The previous 0.05 m floor
        # cutoff was relative to map/base height, not height above the ground.
        origin_z: -0.30
        z_resolution: 0.15
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        min_obstacle_height: -0.25           # ~5 cm above modeled flat ground
        max_obstacle_height: 2.0
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.25
          max_obstacle_height: 2.0
          obstacle_min_range: 0.3
          obstacle_max_range: 8.0
          raytrace_min_range: 0.3
          raytrace_max_range: 10.0
          observation_persistence: 0.0
          # Maximum interval in seconds, NOT Hz. A stale cloud makes the map
          # non-current; FollowPath waits for fresh observations before driving.
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        # Padded footprint corner radius ~= 0.84 m. Inflation must reach beyond
        # that radius for efficient Smac/MPPI polygon collision checks. Previously
        # inflation_radius was under obstacle_layer, where it had no effect.
        inflation_radius: 0.9
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      transform_tolerance: 1.0
      footprint: "[[0.62, 0.53], [0.62, -0.53], [-0.62, -0.53], [-0.62, 0.53]]"
      footprint_padding: 0.02
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      # Preserve unknown vs observed-free cells. Humble MPPI's CostCritic allows
      # unknown when tracking it; this alone does not prevent driving into unseen
      # space. Front camera coverage, latency and stopping range must be checked.
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        footprint_clearing_enabled: true
        origin_z: -0.30
        z_resolution: 0.15
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        min_obstacle_height: -0.25
        max_obstacle_height: 2.0
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: PointCloud2
          marking: true
          clearing: true
          min_obstacle_height: -0.25
          max_obstacle_height: 2.0
          obstacle_min_range: 0.3
          obstacle_max_range: 5.0
          raytrace_min_range: 0.3
          raytrace_max_range: 6.0
          observation_persistence: 0.0
          expected_update_rate: 0.5
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        enabled: true
        inflation_radius: 0.9
        cost_scaling_factor: 3.0
        inflate_unknown: false
        inflate_around_unknown: false

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.5
    cycle_frequency: 10.0
    # The custom trees reference only Wait. No Spin/BackUp action servers are
    # exposed; normal path steering remains available through the controller.
    behavior_plugins: [wait]
    wait:
      plugin: nav2_behaviors/Wait

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false                         # no artificial dwell at each target
      waypoint_pause_duration: 0
    # rover_navigation still owns GPS conversion and rolling-window subgoals.
    # Do not assume Rolling's FollowGPSWaypoints exists in Humble.

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: true                   # preserve curvature during limiting
    feedback: OPEN_LOOP                      # avoids chasing delayed/noisy odom
    max_velocity: [0.25, 0.0, 0.35]
    # Forward-only autonomous motion. Guard independently enforces these signs.
    min_velocity: [0.0, 0.0, -0.35]
    max_accel: [0.2, 0.0, 0.4]
    max_decel: [-0.4, 0.0, -0.4]
    odom_topic: /odometry/local
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 0.5

collision_monitor:
  ros__parameters:
    use_sim_time: false
    # nav2.launch.py wires controller/Wait -> smoother -> Collision Monitor ->
    # velocity_guard -> motor input. There is no autonomous bypass or sign flip.
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: /cmd_vel_filtered
    cmd_vel_out_topic: /cmd_vel_checked
    transform_tolerance: 0.5
    source_timeout: 0.5
    base_shift_correction: true
    stop_pub_timeout: 1.0
    # Front-only strips begin outside the padded footprint (x=0.64) to avoid
    # stopping on rover self returns. The stop zone extends ~0.46 m ahead of
    # that edge. Verify actual braking distance and camera near-field visibility.
    # These zones DO NOT protect reverse motion, side sweep or drop-offs.
    polygons: [FrontStop, FrontSlow]
    FrontStop:
      type: polygon
      points: [1.10, 0.65, 1.10, -0.65, 0.64, -0.65, 0.64, 0.65]
      action_type: stop
      max_points: 3                          # Humble triggers on >3 points
      visualize: true
      polygon_pub_topic: /collision_monitor/front_stop
      enabled: true
    FrontSlow:
      type: polygon
      points: [1.70, 0.75, 1.70, -0.75, 0.64, -0.75, 0.64, 0.75]
      action_type: slowdown
      max_points: 3
      slowdown_ratio: 0.4
      visualize: true
      polygon_pub_topic: /collision_monitor/front_slow
      enabled: true
    observation_sources: [zed_cloud]
    zed_cloud:
      type: pointcloud
      topic: /zed/zed_node/point_cloud/cloud_registered
      # Point-cloud heights are evaluated in base_link, not optical-frame Z.
      min_height: -0.25
      max_height: 2.0
      enabled: true
    # Humble drops stale observations; source_timeout is NOT a fail-closed
    # sensor watchdog. The velocity_guard below implements that stop.

velocity_guard:
  ros__parameters:
    use_sim_time: false
    input_topic: /cmd_vel_checked
    output_topic: /diff_drive_controller/cmd_vel_unstamped
    cloud_topic: /zed/zed_node/point_cloud/cloud_registered
    command_timeout: 0.3
    sensor_timeout: 0.75
    odometry_timeout: 0.75
    gps_timeout: 2.0
    transform_timeout: 0.75
    startup_hold: 2.0
    max_linear: 0.25
    max_angular: 0.35
    # Latch an unexpected correction rather than declaring arrival after a pose
    # jump. These thresholds concern discontinuities, not GNSS accuracy. A latched
    # fault requires checking localization and restarting the navigation stack.
    jump_distance: 1.0
    jump_angle: 0.7
