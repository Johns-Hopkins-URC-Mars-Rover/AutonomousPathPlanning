controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_front_joint", "left_mid_joint", "left_back_joint"]
    right_wheel_names: ["right_front_joint", "right_mid_joint", "right_back_joint"]

    wheel_separation: 0.52
    wheel_radius: 0.1

    base_frame_id: base_link
    odom_frame_id: odom

    publish_rate: 50.0
    cmd_vel_timeout: 0.5

    use_stamped_vel: false