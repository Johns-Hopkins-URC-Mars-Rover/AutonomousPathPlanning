controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    left_wheel_names: ["left_front_joint", "left_mid_joint", "left_back_joint"]
    right_wheel_names: ["right_front_joint", "right_mid_joint", "right_back_joint"]

    # Measured from the simplified URDF wheel collision centers:
    # Mean left y = +0.348785 m, mean right y = -0.346668 m,
    # including wheel collision-origin offsets. Geometric fixture value;
    # a physical skid-steer effective track requires calibration.
    wheel_separation: 0.695453
    wheel_radius: 0.0975

    base_frame_id: base_link
    odom_frame_id: odom

    publish_rate: 50.0
    cmd_vel_timeout: 0.5
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.01]

    use_stamped_vel: false
    # robot_localization is the sole odom -> base_link owner.
    enable_odom_tf: false
