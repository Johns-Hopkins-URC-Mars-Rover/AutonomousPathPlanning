bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/local
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"

controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /odometry/local
    controller_plugins: ["FollowPath"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 1.0
      yaw_goal_tolerance: 1.0
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      GoalAlign.scale: 24.0
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 20.0
      max_vel_x: 0.5
      min_vel_x: -0.5
      max_vel_y: 0.0          # ADD THIS - diff drive can't move sideways
      min_vel_y: 0.0          # ADD THIS
      max_vel_theta: 1.0
      min_vel_theta: -1.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0          # ADD THIS
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0        # ADD THIS
      decel_lim_theta: -3.2
      vx_samples: 20
      vy_samples: 1           # ADD THIS - only 1 sample needed since vy is always 0
      vtheta_samples: 20
      sim_time: 1.7
      min_speed_xy: 0.0       # ADD THIS
      max_speed_xy: 0.5       # ADD THIS
      min_speed_theta: 0.0    # ADD THIS

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # REEDS_SHEPP allows for backward movement
      # DUBIN is forward-only
      motion_model_for_search: "REEDS_SHEPP" 
      minimum_turning_radius: 1.0  # placeholder value
      angle_quantization_bins: 72 # how fine you want angle movements to be

      # tolerance is based on estimated distance left, takes heading into account
      tolerance: 0.25 # in meters
      allow_unknown: false # don't go into unknown places :(
      max_planning_time: 5.0 # in seconds
      downsample_costmap: false # don't decrease costmap resolution

      analytic_expansion_max_length: 5.0 # how far to look in the future
      smooth_path: true # uhhh smooth ?

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # The physical ZED cloud can arrive several hundred milliseconds after
      # capture. Allow TF to catch up before discarding the observation.
      transform_tolerance: 2.0
      rolling_window: true
      # The GPS client advances through this rolling window using intermediate goals.
      width: 10
      height: 10
      resolution: 0.05
      # Enclose the URDF collision meshes at neutral joint positions.
      footprint: "[[0.60, 0.40], [0.60, -0.40], [-0.52, -0.40], [-0.52, 0.40]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        footprint_clearing_enabled: true
        # URDF ground is approximately z=-0.30 relative to base_link.
        # Sixteen 0.15 m layers cover [-0.30, 2.10), including 2 m returns.
        origin_z: -0.30
        z_resolution: 0.15
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        min_obstacle_height: -0.25
        max_obstacle_height: 2.0
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          # Approximately 5 cm above the URDF-derived ground plane.
          min_obstacle_height: -0.25
          max_obstacle_height: 2.0
          obstacle_min_range: 0.3
          obstacle_max_range: 8.0
          raytrace_min_range: 0.3
          raytrace_max_range: 10.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      transform_tolerance: 1.0
      rolling_window: true
      width: 8
      height: 8
      resolution: 0.05
      robot_radius: 0.381
      track_unknown_space: true
      # Use the same physical footprint as the global costmap.
      footprint: "[[0.60, 0.40], [0.60, -0.40], [-0.52, -0.40], [-0.52, 0.40]]"
      footprint_padding: 0.01
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        footprint_clearing_enabled: true
        # URDF ground is approximately z=-0.30 relative to base_link.
        # Sixteen 0.15 m layers cover [-0.30, 2.10), including 2 m returns.
        origin_z: -0.30
        z_resolution: 0.15
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        min_obstacle_height: -0.25
        max_obstacle_height: 2.0
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          # Approximately 5 cm above the URDF-derived ground plane.
          min_obstacle_height: -0.25
          max_obstacle_height: 2.0
          obstacle_min_range: 0.3
          obstacle_max_range: 5.0
          raytrace_min_range: 0.3
          raytrace_max_range: 6.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
