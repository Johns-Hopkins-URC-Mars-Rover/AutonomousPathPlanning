global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: false
      # The physical ZED cloud can arrive several hundred milliseconds after
      # capture. Allow TF to catch up before discarding the observation.
      transform_tolerance: 1.0
      rolling_window: true
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.381
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        footprint_clearing_enabled: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        unknown_threshold: 15
        mark_threshold: 0
        max_obstacle_height: 2.0
        observation_sources: zed_cloud
        zed_cloud:
          topic: /zed/zed_node/point_cloud/cloud_registered
          data_type: "PointCloud2"
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.3
          obstacle_max_range: 8.0
          raytrace_min_range: 0.3
          raytrace_max_range: 10.0
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

