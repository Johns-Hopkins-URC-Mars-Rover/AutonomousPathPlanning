/costmap/costmap:
  ros__parameters:
    use_sim_time: false

    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3

    update_frequency: 5.0
    publish_frequency: 2.0

    rolling_window: true
    width: 8
    height: 8
    resolution: 0.05

    track_unknown_space: true
    always_send_full_costmap: true

    # Visualization-only placeholder, not the rover's actual footprint.
    robot_radius: 0.20

    plugins: ["voxel_layer", "inflation_layer"]

    voxel_layer:
      plugin: "nav2_costmap_2d::VoxelLayer"
      enabled: true
      publish_voxel_map: true
      footprint_clearing_enabled: true
      origin_z: 0.0
      z_resolution: 0.05
      z_voxels: 16
      unknown_threshold: 15
      mark_threshold: 0
      max_obstacle_height: 1.50

      observation_sources: zed_cloud

      zed_cloud:
        topic: /zed/zed_node/point_cloud/cloud_registered
        data_type: "PointCloud2"

        marking: true
        clearing: true

        min_obstacle_height: 0.05
        max_obstacle_height: 1.50

        obstacle_min_range: 0.30
        obstacle_max_range: 3.0
        raytrace_min_range: 0.30
        raytrace_max_range: 3.5

        observation_persistence: 0.0

    inflation_layer:
      plugin: "nav2_costmap_2d::InflationLayer"
      enabled: true
      inflation_radius: 0.40
      cost_scaling_factor: 3.0
