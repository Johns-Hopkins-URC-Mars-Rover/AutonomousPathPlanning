ekf_global:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.3
    two_d_mode: false
    publish_tf: true
    print_diagnostics: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: map
    # Reuse local body-frame motion, not its odom-frame absolute pose.
    # Do not fuse its raw camera/gyro measurements again here.
    odom0: /odometry/local
    odom0_config: [false, false, false,
                   false, false, false,
                   true, true, true,
                   true, true, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    odom1: /odometry/gps
    odom1_config: [true, true, true,
                   false, false, false,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_differential: false
    odom1_queue_size: 10
    imu0: /localization/heading
    imu0_config: [false, false, false,
                  true, true, true,
                  false, false, false,
                  false, false, false,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
